server:
  port: ${PORT}

spring:
  application:
    name: abitandstudhelp-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
      org:
        hibernate:
          envers:
            audit_table_suffix: _aud
  flyway:
    default-schema: public
    baseline-on-migrate: true
    baseline-version: 1
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL}

app:
  rag:
    top-k: 5
    chunk-size: 1200
    chunk-overlap: 200
    max-context-chars: 6000
    ingest-on-startup: false
  gemini:
    api-key: ${GEMINI_API_KEY}
    embedding-model: gemini-embedding-001
    embedding-dimension: 768
    base-url: https://generativelanguage.googleapis.com/v1beta

storage:
  endpoint: ${STORAGE_ENDPOINT}
  region: eu-central-1
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
  bucket: ${STORAGE_BUCKET_NAME}
  schedule-bucket: ${SCHEDULE_BUCKET_NAME:schedule}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL}

schedule:
  parser-url: ${SCHEDULE_PARSER_URL:http://localhost:9001/parse-schedule}

jwt:
  secret-key: ${JWT_SECRET_KEY}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate